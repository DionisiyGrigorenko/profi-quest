<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ПрофіКвест — Знайди свою професію</title>
  
  <!-- FontAwesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- html2canvas для створення скріншоту-сертифіката -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    :root {
      --primary: #4F46E5;
      --primary-hover: #4338CA;
      --secondary: #0284C7;
      --success: #10B981;
      --danger: #EF4444;
      --bg-gradient: linear-gradient(135deg, #F0F9FF 0%, #E0F2FE 40%, #F3E8FF 100%);
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(255, 255, 255, 0.6);
      --text-main: #0F172A;
      --text-muted: #64748B;
      --shadow-sm: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      --shadow-lg: 0 20px 40px -15px rgba(79, 70, 229, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 15px;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      height: 100vh;
      max-height: 840px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 5px;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 1.25rem;
      background: linear-gradient(to right, #4F46E5, #9333EA);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: rgba(226, 232, 240, 0.8);
      border-radius: 10px;
      overflow: hidden;
      margin-top: 5px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), #8B5CF6);
      transition: width 0.3s ease;
      border-radius: 10px;
    }

    /* Screen Wrappers */
    .screen {
      flex: 1;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      animation: fadeIn 0.4s ease;
    }

    .screen.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Registration Screen */
    .form-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 32px 24px;
      width: 100%;
      box-shadow: var(--shadow-lg);
    }

    .form-card h2 {
      font-size: 1.6rem;
      margin-bottom: 8px;
      text-align: center;
      color: #1E293B;
      font-weight: 800;
    }

    .form-card p {
      color: var(--text-muted);
      font-size: 0.92rem;
      text-align: center;
      margin-bottom: 24px;
      line-height: 1.4;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: #334155;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 14px 16px;
      background: #FFFFFF;
      border: 1.5px solid #E2E8F0;
      border-radius: 14px;
      color: #0F172A;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
    }

    .btn-submit {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--primary), #6366F1);
      color: #FFF;
      font-weight: 700;
      font-size: 1.05rem;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(79, 70, 229, 0.25);
      transition: transform 0.1s, opacity 0.2s;
      margin-top: 10px;
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    /* Game / Cards Screen */
    .card-stack {
      width: 100%;
      height: 480px;
      position: relative;
      perspective: 1000px;
    }

    .swipe-card {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 32px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1.5px solid #FFFFFF;
      padding: 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 20px 35px -10px rgba(15, 23, 42, 0.08);
      touch-action: none;
      cursor: grab;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .swipe-card:active {
      cursor: grabbing;
    }

    .card-badge {
      align-self: flex-start;
      padding: 6px 14px;
      border-radius: 20px;
      background: #EEF2FF;
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--primary);
      border: 1px solid #C7D2FE;
    }

    .card-content {
      text-align: center;
      margin: auto 0;
    }

    .card-icon {
      font-size: 3.8rem;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #4F46E5, #9333EA);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .card-question {
      font-size: 1.35rem;
      font-weight: 800;
      line-height: 1.35;
      color: #1E293B;
    }

    .card-subtext {
      font-size: 0.92rem;
      color: var(--text-muted);
      margin-top: 12px;
      line-height: 1.45;
    }

    /* Choice Stamps */
    .stamp {
      position: absolute;
      top: 40px;
      padding: 8px 18px;
      border-radius: 14px;
      font-size: 1.3rem;
      font-weight: 800;
      text-transform: uppercase;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.1s ease;
      border: 3px solid;
    }

    .stamp.like {
      right: 25px;
      color: var(--success);
      border-color: var(--success);
      background: rgba(16, 185, 129, 0.1);
      transform: rotate(12deg);
    }

    .stamp.dislike {
      left: 25px;
      color: var(--danger);
      border-color: var(--danger);
      background: rgba(239, 68, 68, 0.1);
      transform: rotate(-12deg);
    }

    /* Controls */
    .controls {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 25px;
      width: 100%;
    }

    .btn-circle {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(0,0,0,0.06);
      transition: transform 0.15s ease, background 0.2s, box-shadow 0.2s;
    }

    .btn-circle:active {
      transform: scale(0.9);
    }

    .btn-no {
      background: #FEF2F2;
      border: 2px solid #FCA5A5;
      color: var(--danger);
    }

    .btn-yes {
      background: #ECFDF5;
      border: 2px solid #6EE7B7;
      color: var(--success);
    }

    /* Results Screen */
    .results-container {
      width: 100%;
      overflow-y: auto;
      max-height: 75vh;
      padding-right: 4px;
    }

    .results-container::-webkit-scrollbar {
      width: 4px;
    }
    .results-container::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.3);
      border-radius: 4px;
    }

    .result-card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 15px;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .result-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 6px; height: 100%;
      background: var(--primary);
    }

    .result-card.top-1::before { background: #F59E0B; }
    .result-card.top-2::before { background: #64748B; }
    .result-card.top-3::before { background: #D97706; }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .result-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #0F172A;
    }

    .result-score {
      font-weight: 800;
      font-size: 0.85rem;
      padding: 4px 12px;
      border-radius: 12px;
      background: #EEF2FF;
      color: var(--primary);
    }

    .result-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.45;
      margin-bottom: 12px;
    }

    .skills-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .skill-tag {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 8px;
      background: #F1F5F9;
      border: 1px solid #E2E8F0;
      color: #475569;
    }

    /* Export/Certificate styling */
    #certificate-area {
      background: linear-gradient(135deg, #FFFFFF 0%, #F8FAFC 100%);
      padding: 24px;
      border-radius: 24px;
      border: 1px solid #E2E8F0;
      box-shadow: var(--shadow-sm);
    }

    .cert-user-info {
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px dashed #E2E8F0;
    }

    .cert-user-name {
      font-size: 1.4rem;
      font-weight: 800;
      color: #0F172A;
    }

    .cert-user-meta {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 18px;
      width: 100%;
    }

    .btn-action {
      padding: 14px;
      border-radius: 14px;
      border: none;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-action:active {
      transform: scale(0.98);
    }

    .btn-share {
      background: linear-gradient(135deg, var(--primary), #6366F1);
      color: #FFF;
      box-shadow: 0 8px 18px rgba(79, 70, 229, 0.2);
    }

    .btn-restart {
      background: #FFFFFF;
      color: #334155;
      border: 1.5px solid #E2E8F0;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <header>
      <div class="brand">
        <i class="fa-solid fa-compass"></i>
        <span>ПрофіКвест</span>
      </div>
      <div id="counter" style="font-size: 0.88rem; font-weight: 800; color: var(--text-muted); display: none;">
        <span id="current-card-num">1</span>/20
      </div>
    </header>

    <div class="progress-bar-container">
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <!-- SCREEN 1: Registration Form -->
    <div class="screen active" id="screen-reg">
      <div class="form-card">
        <h2>Вітаємо в ПрофіКвест!</h2>
        <p>Дай відповіді на 20 питань, щоб дізнатися, які професії підходять тобі найбільше.</p>
        
        <form id="reg-form" onsubmit="startQuest(event)">
          <div class="form-group">
            <label for="user-name">Твоє ім'я</label>
            <input type="text" id="user-name" placeholder="Введіть ім'я" required autocomplete="off">
          </div>

          <div class="form-group">
            <label for="user-gender">Стать</label>
            <select id="user-gender" required>
              <option value="" disabled selected>Обери стать</option>
              <option value="Жіноча">Жіноча</option>
              <option value="Чоловіча">Чоловіча</option>
            </select>
          </div>

          <div class="form-group">
            <label for="user-grade">Клас</label>
            <select id="user-grade" required>
              <option value="" disabled selected>Обери клас</option>
              <option value="8">8 клас</option>
              <option value="9">9 клас</option>
              <option value="10">10 клас</option>
              <option value="11">11 клас</option>
            </select>
          </div>

          <button type="submit" class="btn-submit">Розпочати квест <i class="fa-solid fa-arrow-right"></i></button>
        </form>
      </div>
    </div>

    <!-- SCREEN 2: Game Swipe Cards -->
    <div class="screen" id="screen-game">
      <div class="card-stack" id="card-stack">
        <!-- Dynamic card inserted here -->
      </div>

      <div class="controls">
        <button class="btn-circle btn-no" onclick="handleButtonClick(false)">
          <i class="fa-solid fa-xmark"></i>
        </button>
        <button class="btn-circle btn-yes" onclick="handleButtonClick(true)">
          <i class="fa-solid fa-heart"></i>
        </button>
      </div>
    </div>

    <!-- SCREEN 3: Results -->
    <div class="screen" id="screen-results">
      <div class="results-container">
        
        <div id="certificate-area">
          <div class="cert-user-info">
            <div class="cert-user-name" id="res-user-name">Олександр</div>
            <div class="cert-user-meta"><span id="res-user-grade">10</span> клас • Топ рекомендації професій</div>
          </div>

          <div id="top-professions-list">
            <!-- Dynamic professions list -->
          </div>
        </div>

        <div class="action-buttons">
          <button class="btn-action btn-share" onclick="downloadScreenshot()">
            <i class="fa-solid fa-camera"></i> Завантажити скріншот результату
          </button>
          <button class="btn-action btn-restart" onclick="restartQuest()">
            <i class="fa-solid fa-rotate-right"></i> Пройти знову
          </button>
        </div>

      </div>
    </div>

  </div>

  <script>
    // 20 Questions Data Bank
    const questions = [
      { id: 1, cat: 'it', icon: 'fa-code', badge: 'Технології', title: 'Створення програм', text: 'Тобі подобається розбиратися, як влаштовані додатки, сайти чи написати свій код?' },
      { id: 2, cat: 'design', icon: 'fa-palette', badge: 'Творчість', title: 'Візуальний стиль', text: 'Любиш малювати, обробляти фото, монтувати відео чи вибирати кольори для дизайну?' },
      { id: 3, cat: 'people', icon: 'fa-comments', badge: 'Комунікація', title: 'Допомога іншим', text: 'Тобі легко знаходити спільну мову з людьми, вислуховувати їх та допомагати?' },
      { id: 4, cat: 'business', icon: 'fa-chart-line', badge: 'Бізнес', title: 'Організація та старт', text: 'Цікавишся тим, як заробляти гроші, вести власну справу чи керувати проектами?' },
      { id: 5, cat: 'science', icon: 'fa-microscope', badge: 'Наука', title: 'Дослідження', text: 'Подобається проводити експерименти, досліджувати природу чи вивчати формули?' },
      { id: 6, cat: 'media', icon: 'fa-bullhorn', badge: 'Медіа', title: 'Публічність та контент', text: 'Любиш вести соцмережі, знімати сторіз, писати тексти чи виступати перед публікою?' },
      { id: 7, cat: 'engineering', icon: 'fa-gears', badge: 'Техніка', title: 'Складання та ремонт', text: 'Цікаво розбирати прилади, ремонтувати щось або конструювати фізичні об’єкти?' },
      { id: 8, cat: 'it', icon: 'fa-shield-halved', badge: 'Безпека', title: 'Кібербезпека', text: 'Хотілось би захищати важливу інформацію від хакерів та зламу?' },
      { id: 9, cat: 'people', icon: 'fa-user-doctor', badge: 'Здоров\'я', title: 'Медицина та турбота', text: 'Цікавишся будовою тіла людини, здоровим способом життя чи медициною?' },
      { id: 10, cat: 'business', icon: 'fa-calculator', badge: 'Аналітика', title: 'Робота з даними', text: 'Любиш працювати з таблицями, числами, графіками та знаходити в них логіку?' },
      { id: 11, cat: 'design', icon: 'fa-wand-magic-sparkles', badge: '3D & VR', title: 'Віртуальні світи', text: 'Хотів би створювати 3D-моделі, персонажів для ігор або об\'єкти у VR?' },
      { id: 12, cat: 'media', icon: 'fa-pen-nib', badge: 'Тексти', title: 'Копірайтинг & Сторітелінг', text: 'Тобі легко дається висловлювати думки письмово та писати цікаві історії?' },
      { id: 13, cat: 'science', icon: 'fa-leaf', badge: 'Екологія', title: 'Захист довкілля', text: 'Хвилює тема екології, відновлюваної енергії та майбутнього нашої планети?' },
      { id: 14, cat: 'engineering', icon: 'fa-robot', badge: 'Робототехніка', title: 'Роботи та Дрони', text: 'Мрієш програмувати роботів або конструювати безпілотні апарати?' },
      { id: 15, cat: 'people', icon: 'fa-graduation-cap', badge: 'Освіта', title: 'Навчання інших', text: 'Подобається пояснювати складні речі просто та навчати інших людей новому?' },
      { id: 16, cat: 'it', icon: 'fa-brain', badge: 'ШІ та Дані', title: 'Штучний Інтелект', text: 'Захоплюєшся можливостями ChatGPT, Midjourney та розвитком ШІ?' },
      { id: 17, cat: 'business', icon: 'fa-scale-balanced', badge: 'Право', title: 'Закони та Захист', text: 'Цікаво відстоювати справедливість, вивчати закони та правильність договорів?' },
      { id: 18, cat: 'design', icon: 'fa-house-laptop', badge: 'Простір', title: 'Інтер\'єр та Архітектура', text: 'Любиш планивати простір, проектувати будинки чи дизайн кімнат?' },
      { id: 19, cat: 'media', icon: 'fa-video', badge: 'Відеовиробництво', title: 'Кіно та Монтаж', text: 'Хотів би створювати якісні відеоролики, обирати ракурси та працювати зі звуком?' },
      { id: 20, cat: 'business', icon: 'fa-lightbulb', badge: 'Стартапи', title: 'Генерація ідей', text: 'Постійно придумуєш нові ідеї для продуктів, сервісів чи покращення життя?' }
    ];

    // Professions Database
    const professionsDb = {
      it: { title: 'IT & Розробка ПЗ', desc: 'Створення додатків, сайтів, систем штучного інтелекту та кібербезпека.', skills: ['Python/JS', 'Логіка', 'Алгоритми', 'English'] },
      design: { title: 'Дизайн & Креатив', desc: 'UI/UX дизайн, 3D-графіка, брендінг, створення візуальних концептів.', skills: ['Figma', 'Photoshop', 'Креативність', 'Стиль'] },
      people: { title: 'Психологія & Медицина & HR', desc: 'Робота з людьми, турбота про здоров\'я, розвиток та підбір персоналу.', skills: ['Емпатія', 'Комунікація', 'Слухання', 'Стресостійкість'] },
      business: { title: 'Менеджмент & Аналітика', desc: 'Керування проектами, фінанси, стартапи, бізнес-аналітика.', skills: ['Лідерство', 'Планування', 'Аналітика', 'Переговори'] },
      science: { title: 'Наука & Дослідження', desc: 'Лабораторні дослідження, біотехнології, екологія та нові матеріали.', skills: ['Аналітичний розум', 'Уважність', 'Критичне мислення'] },
      media: { title: 'Маркетинг, PR & Медіа', desc: 'Просування брендів, створення контенту, блогінг, журналістика.', skills: ['SMM', 'Копірайтинг', 'Креатив', 'Публічність'] },
      engineering: { title: 'Інженерія & Робототехніка', desc: 'Проектування механізмів, робототехніка, автоматизація систем.', skills: ['Фізика', 'CAD-моделювання', 'Конструювання'] }
    };

    // State Variables
    let userInfo = {};
    let currentCardIndex = 0;
    let scores = { it: 0, design: 0, people: 0, business: 0, science: 0, media: 0, engineering: 0 };
    let currentTopProfessions = [];

    // Registration Form Submit
    function startQuest(e) {
      e.preventDefault();
      userInfo = {
        name: document.getElementById('user-name').value.trim(),
        gender: document.getElementById('user-gender').value,
        grade: document.getElementById('user-grade').value
      };

      document.getElementById('screen-reg').classList.remove('active');
      document.getElementById('screen-game').classList.add('active');
      document.getElementById('counter').style.display = 'block';

      renderCard();
    }

    // Render Current Card
    function renderCard() {
      const stack = document.getElementById('card-stack');
      stack.innerHTML = '';

      if (currentCardIndex >= questions.length) {
        showResults();
        return;
      }

      // Update progress
      const progress = ((currentCardIndex) / questions.length) * 100;
      document.getElementById('progress-bar').style.width = `${progress}%`;
      document.getElementById('current-card-num').innerText = currentCardIndex + 1;

      const q = questions[currentCardIndex];

      const card = document.createElement('div');
      card.className = 'swipe-card';
      card.id = 'active-card';

      card.innerHTML = `
        <div class="stamp like">ТАК</div>
        <div class="stamp dislike">НІ</div>
        <div class="card-badge">${q.badge}</div>
        <div class="card-content">
          <i class="fa-solid ${q.icon} card-icon"></i>
          <div class="card-question">${q.title}</div>
          <div class="card-subtext">${q.text}</div>
        </div>
        <div style="text-align: center; font-size: 0.78rem; font-weight: 600; color: var(--text-muted);">
          Свайпай праворуч (Так) або ліворуч (Ні)
        </div>
      `;

      stack.appendChild(card);
      initSwipe(card);
    }

    // Touch & Mouse Drag Logic
    function initSwipe(card) {
      let startX = 0, currentX = 0;
      let isDragging = false;

      const stampLike = card.querySelector('.stamp.like');
      const stampDislike = card.querySelector('.stamp.dislike');

      function onStart(e) {
        isDragging = true;
        startX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
        card.style.transition = 'none';
      }

      function onMove(e) {
        if (!isDragging) return;
        currentX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
        const diffX = currentX - startX;
        const rotate = diffX * 0.05;

        card.style.transform = `translateX(${diffX}px) rotate(${rotate}deg)`;

        if (diffX > 40) {
          stampLike.style.opacity = Math.min(diffX / 100, 1);
          stampDislike.style.opacity = 0;
        } else if (diffX < -40) {
          stampDislike.style.opacity = Math.min(Math.abs(diffX) / 100, 1);
          stampLike.style.opacity = 0;
        } else {
          stampLike.style.opacity = 0;
          stampDislike.style.opacity = 0;
        }
      }

      function onEnd() {
        if (!isDragging) return;
        isDragging = false;
        const diffX = currentX - startX;

        if (diffX > 100) {
          completeSwipe(true);
        } else if (diffX < -100) {
          completeSwipe(false);
        } else {
          card.style.transition = 'transform 0.2s ease';
          card.style.transform = 'translateX(0) rotate(0)';
          stampLike.style.opacity = 0;
          stampDislike.style.opacity = 0;
        }
      }

      card.addEventListener('touchstart', onStart, { passive: true });
      card.addEventListener('touchmove', onMove, { passive: true });
      card.addEventListener('touchend', onEnd);
      card.addEventListener('touchcancel', onEnd);

      card.addEventListener('mousedown', onStart);
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onEnd);
    }

    function handleButtonClick(isYes) {
      completeSwipe(isYes);
    }

    function completeSwipe(isYes) {
      const card = document.getElementById('active-card');
      if (!card) return;

      const q = questions[currentCardIndex];
      if (isYes) {
        scores[q.cat] = (scores[q.cat] || 0) + 1;
      }

      const moveOutX = isYes ? window.innerWidth : -window.innerWidth;
      card.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
      card.style.transform = `translateX(${moveOutX}px) rotate(${isYes ? 20 : -20}deg)`;
      card.style.opacity = '0';

      setTimeout(() => {
        currentCardIndex++;
        renderCard();
      }, 250);
    }

    // Calculate & Display Results
    function showResults() {
      document.getElementById('screen-game').classList.remove('active');
      document.getElementById('screen-results').classList.add('active');
      document.getElementById('counter').style.display = 'none';
      document.getElementById('progress-bar').style.width = '100%';

      document.getElementById('res-user-name').innerText = userInfo.name;
      document.getElementById('res-user-grade').innerText = userInfo.grade;

      // Sort Categories by Score
      const sortedCategories = Object.keys(scores).sort((a, b) => scores[b] - scores[a]);
      const top3 = sortedCategories.slice(0, 3);

      const listContainer = document.getElementById('top-professions-list');
      listContainer.innerHTML = '';

      currentTopProfessions = [];

      top3.forEach((cat, idx) => {
        const prof = professionsDb[cat];
        const matchPercent = Math.min(Math.round((scores[cat] / 3) * 100), 98) || (70 - idx * 10);

        currentTopProfessions.push({
          title: prof.title,
          score: matchPercent
        });

        const item = document.createElement('div');
        item.className = `result-card top-${idx + 1}`;
        item.innerHTML = `
          <div class="result-header">
            <div class="result-title">${prof.title}</div>
            <div class="result-score">${matchPercent}% Сумісність</div>
          </div>
          <div class="result-desc">${prof.desc}</div>
          <div class="skills-list">
            ${prof.skills.map(s => `<span class="skill-tag">${s}</span>`).join('')}
          </div>
        `;
        listContainer.appendChild(item);
      });

      // Background data collection (Silent send to teacher's spreadsheet)
      sendDataToGoogleSheets({
        userInfo: userInfo,
        topProfessions: currentTopProfessions,
        scores: scores
      });
    }

    // Google Sheets Integration Script
    function sendDataToGoogleSheets(data) {
      const GOOGLE_SCRIPT_URL = "https://script.google.com/a/macros/umanlyceum3.ukr.education/s/AKfycby9gHRifG-aC7k6dNW_TGDICiVbELISjahIE5zPN8K7kffAPDQ3WQtsF9o_ob0HWRlLBw/exec";

      if (!GOOGLE_SCRIPT_URL) return;

      const payloadData = {
        name: data.userInfo.name,
        gender: data.userInfo.gender,
        grade: data.userInfo.grade,
        top1: data.topProfessions[0] ? `${data.topProfessions[0].title} (${data.topProfessions[0].score}%)` : '',
        top2: data.topProfessions[1] ? `${data.topProfessions[1].title} (${data.topProfessions[1].score}%)` : '',
        top3: data.topProfessions[2] ? `${data.topProfessions[2].title} (${data.topProfessions[2].score}%)` : '',
        scores: JSON.stringify(data.scores)
      };

      fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payloadData)
      }).catch(err => console.log('Error sending stats:', err));
    }

    // Screenshot Generation
    function downloadScreenshot() {
      const target = document.getElementById('certificate-area');
      
      html2canvas(target, {
        backgroundColor: '#F8FAFC',
        scale: 2
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = `ПрофіКвест_${userInfo.name}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }

    // Restart Quest
    function restartQuest() {
      currentCardIndex = 0;
      scores = { it: 0, design: 0, people: 0, business: 0, science: 0, media: 0, engineering: 0 };
      document.getElementById('screen-results').classList.remove('active');
      document.getElementById('screen-reg').classList.add('active');
      document.getElementById('reg-form').reset();
    }
  </script>
</body>
</html>
